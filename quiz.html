<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Disciplinas - Quiz Escolar</title>
    <link rel="stylesheet" href="style.css">
    <script src="quiz.js" defer></script>
</head>

<body>

    <header>
        <h1>Escolha sua disciplina</h1>
    </header>

   <main class="sobre">

    <h2>Escolha uma disciplina</h2>
    <p>Selecione a matéria que deseja estudar.</p>

    <div class="disciplinas">
        <button class="disciplina">Matemática</button>
        <button class="disciplina">Português</button>
        <button class="disciplina">Química</button>
        <button class="disciplina">Biologia</button>
        <button class="disciplina">História</button>
        <button class="disciplina">Geografia</button>
        <button class="disciplina">Física</button>
        <button class="disciplina">Sociologia</button>
     </div>
     <section id="areaQuiz" hidden>

    <h2 id="tituloMateria"></h2>

    <p id="pergunta"></p>

    <div id="alternativas"></div>

    <p id="resultado"></p>

    <button id="proxima" hidden>
        Próxima questão
    </button>

</section>

    <a href="index.html">Voltar à página inicial</a>

</main>

</body>
</html>
